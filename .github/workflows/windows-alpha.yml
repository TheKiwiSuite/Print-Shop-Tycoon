name: Package Windows alpha
on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-alpha.yml, 'source/**', 'Build-Release.ps1', 'Run-QA.ps1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install matching official Godot engine and templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base=https://github.com/godotengine/godot/releases/download/4.5.1-stable
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          for file in Godot_v4.5.1-stable_linux.x86_64.zip Godot_v4.5.1-stable_export_templates.tpz; do
            curl --fail --location --retry 3 "$base/$file" -o "$file"
            grep " $file$" SHA512-SUMS.txt | sha512sum --check --strict
          done
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.5.1-stable_linux.x86_64
          unzip -q Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
      - name: Import and verify native simulation
        shell: bash
        run: |
          set -euo pipefail
          engine="$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
          "$engine" --headless --path source --editor --import
          mkdir -p "$(realpath -m source/../../../work)"
          for test in acceptance customer_loop sales_growth session_reliability illustrated_equipment rotation_stability illustrated_ui ui_dtf_placement wall_visual_review; do
            timeout 120 xvfb-run -a "$engine" --path source --rendering-method gl_compatibility --audio-driver Dummy --script "res://test/$test.gd" 2>&1 | tee "$RUNNER_TEMP/$test.log"
            if grep -E 'SCRIPT ERROR:|ERROR:|FAIL:' "$RUNNER_TEMP/$test.log"; then exit 1; fi
          done
      - name: Read game version
        id: game
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^config\/version="\([^"]*\)"/\1/p' source/project.godot | tr -d '\r')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Export and package Windows x86_64
        env:
          GAME_VERSION: ${{ steps.game.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/PrintShopTycoon/windows
          "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --headless --path source --export-release 'Windows Desktop' "$GITHUB_WORKSPACE/release/PrintShopTycoon/windows/Print Shop Tycoon.exe"
          cp README.md README.txt RELEASE-NOTES.md GAME-AUDIT.md ART-SOURCES.txt release/PrintShopTycoon/
          printf 'Source commit: %s\nEngine: Godot 4.5.1\nWindows x86_64 alpha %s\nUnsigned community test build. Known issues: GAME-AUDIT.md\n' "$GITHUB_SHA" "$GAME_VERSION" > release/PrintShopTycoon/BUILD.txt
          cd release
          zip -qr "PrintShopTycoon-Windows-v${GAME_VERSION}.zip" PrintShopTycoon
          sha256sum "PrintShopTycoon-Windows-v${GAME_VERSION}.zip" > "PrintShopTycoon-Windows-v${GAME_VERSION}.zip.sha256"
      - name: Publish Windows alpha download
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_VERSION: ${{ steps.game.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${GAME_VERSION}-windows-alpha" "release/PrintShopTycoon-Windows-v${GAME_VERSION}.zip" "release/PrintShopTycoon-Windows-v${GAME_VERSION}.zip.sha256" --target "$GITHUB_SHA" --title "Print Shop Tycoon ${GAME_VERSION} · Windows alpha" --prerelease --notes 'Windows x86_64 alpha built from the recorded source commit with Godot 4.5.1. Extract the ZIP and open windows/Print Shop Tycoon.exe. Changes and validation are in RELEASE-NOTES.md; the older audit remains in GAME-AUDIT.md. This build is unsigned. Simulation and rendered UI checks run before export; this workflow does not certify a native Windows playthrough.'
