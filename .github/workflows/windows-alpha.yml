name: Windows desktop probe
on:
  push:
    branches: ['codex/desktop-acceptance-probe']
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tycoon-build-84eb41987e9fd030d2f37f9b6c5110c6bee42ce4
          run-id: 39095285429
          github-token: ${{ github.token }}
          path: build
      - name: Probe desktop
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $zip=Get-ChildItem build/release/*Windows*.zip | Select-Object -First 1
          $destination=Join-Path $env:RUNNER_TEMP 'game'
          Expand-Archive $zip.FullName $destination
          $folder=Join-Path $destination 'PrintShopTycoon/windows'
          $archive=Join-Path $env:RUNNER_TEMP 'angle.tar.bz2'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://cef-builds.spotifycdn.com/cef_binary_131.4.1%2Bg437feba%2Bchromium-131.0.6778.265_windows64_minimal.tar.bz2' -OutFile $archive
          if((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'F7687D895E8C4BCB9A85078FEED3278C240789058EE25DC39363900331CA23B5'){throw 'Digest mismatch'}
          $prefix='cef_binary_131.4.1+g437feba+chromium-131.0.6778.265_windows64_minimal/Release'
          tar -xjf $archive -C $folder --strip-components=2 "$prefix/libEGL.dll" "$prefix/libGLESv2.dll" "$prefix/d3dcompiler_47.dll"
          ./updater/Test-Desktop.ps1 -Executable (Join-Path $folder 'Print Shop Tycoon.exe') -OutputDirectory desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-probe
          path: desktop/
